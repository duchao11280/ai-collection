[project]
name = "llm-lab"
version = "0.1.0"
description = "Repo thực hành theo learning plan LLM 16 tuần"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs"]

[tool.ruff]
line-length = 100
